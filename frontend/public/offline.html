<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#14213d" />
    <title>EduQuest — Offline</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #f6f4ef;
        color: #14213d;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        background: white;
        border: 1px solid #e3ded3;
        border-radius: 20px;
        padding: 32px;
        max-width: 420px;
        margin: 20px;
      }
      img {
        border-radius: 20px;
      }
      h1 {
        font-size: 28px;
      }
      p {
        line-height: 1.6;
      }
      button {
        font: inherit;
        background: #3b4bdb;
        color: white;
        border: 0;
        border-radius: 10px;
        padding: 14px 24px;
        min-height: 48px;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #14213d;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="72" height="72" alt="" />
      <h1>You’re offline</h1>
      <p>
        Reconnect to open your workspace, send messages or submit a quiz. Your
        saved progress stays on the server.
      </p>
      <button id="retry">Try again</button>
    </main>
    <script>
      document
        .getElementById('retry')
        .addEventListener('click', () => location.reload());
    </script>
  </body>
</html>
